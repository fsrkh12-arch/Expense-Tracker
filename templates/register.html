{% extends "layout.html" %}
{% block title %}Register{% endblock %}
{% block main %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4">
            <h2 class="mb-4 text-primary">✨ Create Account</h2>
            <form action="/register" method="post">
                <div class="mb-3 text-start">
                    <label class="form-label text-muted">👤 Username</label>
                    <input autocomplete="off" autofocus class="form-control" name="username" placeholder="Choose a username" type="text" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label text-muted">🔑 Password</label>
                    <input class="form-control" name="password" placeholder="Create a password" type="password" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label text-muted">🔁 Confirm Password</label>
                    <input class="form-control" name="confirm_password" placeholder="Confirm your password" type="password" required>
                </div>
                <button class="btn btn-primary w-100 mt-2" type="submit">🚀 Register</button>
            </form>
            <div class="mt-4 text-muted">
                Already have an account? <a href="/login" class="text-primary text-decoration-none fw-600">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
