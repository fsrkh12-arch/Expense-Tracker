{% extends "layout.html" %}
{% block title %}Log In{% endblock %}
{% block main %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4">
            <h2 class="mb-4 text-primary">Welcome Back</h2>
            <form action="/login" method="post">
                <div class="mb-3 text-start">
                    <label class="form-label text-muted">Username</label>
                    <input autocomplete="off" autofocus class="form-control" name="username" placeholder="Enter username" type="text" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label text-muted">Password</label>
                    <input class="form-control" name="password" placeholder="Enter password" type="password" required>
                </div>
                <button class="btn btn-primary w-100 mt-2" type="submit">Log In</button>
            </form>
            <div class="mt-4 text-muted">
                Don't have an account? <a href="/register" class="text-primary text-decoration-none fw-600">Register</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
